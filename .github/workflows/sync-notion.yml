name: Sync events from Notion

on:
  schedule:
    - cron: '20 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notion-event-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test sync tooling
        run: npm test

      - name: Synchronize event pages
        run: npm run sync:notion -- --write

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Commit synchronized events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qifa-talk/past qifa-talk/upcoming
          if git diff --cached --quiet; then
            echo "No event changes to commit."
          else
            git commit -m "content: sync events from Notion"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
